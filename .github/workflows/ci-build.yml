name: "CI Build"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  workflow_dispatch:

jobs:
  SaveVersion:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/klogg-version

      - name: Save version
        run: echo $KLOGG_VERSION > klogg_version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: klogg_version
          path: 'klogg_version.txt'
          if-no-files-found: error

  Linux:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          #- os: oraclelinux
          #  os_version: 7
          #  arch: x64
          #  check_command: yum install -y --setopt tsflags=test /usr/local/klogg*.rpm
          #  cpack_gen: RPM
          #  artifacts_id: oracle7
          #  package_suffix: rpm
          #  check_container: oraclelinux:7
          #  container_root: docker/oracle7
          #  container: dm17ryk/klogg_oracle7
          #  cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_USE_HYPERSCAN=OFF

          # - os: oraclelinux
          #   os_version: 8
          #   arch: x64
          #   check_command: yum install -y --setopt tsflags=test /usr/local/klogg*.rpm
          #   cpack_gen: RPM
          #   artifacts_id: oracle
          #   package_suffix: rpm
          #   check_container: oraclelinux:8
          #   container_root: docker/oracle8
          #   container: dm17ryk/klogg_oracle8
          #   cmake_opts: -DCMAKE_BUILD_WITH_INSTALL_RPATH=on -DKLOGG_USE_VECTORSCAN=OFF -DKLOGG_USE_HYPERSCAN=ON

          - os: ubuntu_focal
            os_version: 22.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: focal
            package_suffix: deb
            check_container: ubuntu:22.04
            container_root: docker/ubuntu20.04
            container: dm17ryk/klogg_ubuntu20.04
            cmake_opts:
            container_platform: linux/amd64

          - os: ubuntu_jammy
            os_version: 22.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: jammy
            package_suffix: deb
            check_container: ubuntu:22.04
            container_root: docker/ubuntu22.04
            container: dm17ryk/klogg_ubuntu22.04
            cmake_opts:
            container_platform: linux/amd64

          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container: dm17ryk/klogg_ubuntu24.04
            cmake_opts:
            container_platform: linux/amd64

          - os: ubuntu_appimage
            os_version: 20.04
            arch: x64
            artifacts_id: appimage
            package_suffix: AppImage
            container_root: docker/ubuntu20.04
            container: dm17ryk/klogg_ubuntu20.04
            cmake_opts:
            container_platform: linux/amd64

          - os: ubuntu_focal
            os_version: 22.04
            arch: arm64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: focal-arm64
            package_suffix: deb
            check_container: ubuntu:22.04
            container_root: docker/ubuntu20.04
            container: dm17ryk/klogg_ubuntu20.04_arm64
            cmake_opts:
            container_platform: linux/arm64

          - os: ubuntu_jammy
            os_version: 22.04
            arch: arm64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: jammy-arm64
            package_suffix: deb
            check_container: ubuntu:22.04
            container_root: docker/ubuntu22.04
            container: dm17ryk/klogg_ubuntu22.04_arm64
            cmake_opts:
            container_platform: linux/arm64

          - os: ubuntu_noble
            os_version: 24.04
            arch: arm64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: noble-arm64
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container: dm17ryk/klogg_ubuntu24.04_arm64
            cmake_opts:
            container_platform: linux/arm64

          - os: ubuntu_appimage_arm64
            os_version: 22.04
            arch: arm64
            artifacts_id: appimage-arm64
            package_suffix: AppImage
            container_root: docker/ubuntu22.04
            container: dm17ryk/klogg_ubuntu22.04_appimage_arm64
            cmake_opts:
            container_platform: linux/arm64

          - os: fedora40
            os_version: 22.04
            arch: x64
            check_command: dnf install -y --setopt=tsflags=test /usr/local/klogg*.rpm
            cpack_gen: RPM
            artifacts_id: fedora40
            package_suffix: rpm
            check_container: fedora:40
            container_root: docker/fedora40
            container: dm17ryk/klogg_fedora40
            cmake_opts:
            container_platform: linux/amd64

          - os: fedora41
            os_version: 22.04
            arch: x64
            check_command: dnf install -y --setopt=tsflags=test /usr/local/klogg*.rpm
            cpack_gen: RPM
            artifacts_id: fedora41
            package_suffix: rpm
            check_container: fedora:41
            container_root: docker/fedora41
            container: dm17ryk/klogg_fedora41
            cmake_opts:
            container_platform: linux/amd64

          - os: fedora42
            os_version: 22.04
            arch: x64
            check_command: dnf install -y --setopt=tsflags=test /usr/local/klogg*.rpm
            cpack_gen: RPM
            artifacts_id: fedora42
            package_suffix: rpm
            check_container: fedora:42
            container_root: docker/fedora42
            container: dm17ryk/klogg_fedora42
            cmake_opts:
            container_platform: linux/amd64

          - os: fedora40
            os_version: 22.04
            arch: arm64
            check_command: dnf install -y --setopt=tsflags=test /usr/local/klogg*.rpm
            cpack_gen: RPM
            artifacts_id: fedora40-arm64
            package_suffix: rpm
            check_container: fedora:40
            container_root: docker/fedora40
            container: dm17ryk/klogg_fedora40_arm64
            cmake_opts:
            container_platform: linux/arm64

          - os: fedora41
            os_version: 22.04
            arch: arm64
            check_command: dnf install -y --setopt=tsflags=test /usr/local/klogg*.rpm
            cpack_gen: RPM
            artifacts_id: fedora41-arm64
            package_suffix: rpm
            check_container: fedora:41
            container_root: docker/fedora41
            container: dm17ryk/klogg_fedora41_arm64
            cmake_opts:
            container_platform: linux/arm64

          - os: fedora42
            os_version: 22.04
            arch: arm64
            check_command: dnf install -y --setopt=tsflags=test /usr/local/klogg*.rpm
            cpack_gen: RPM
            artifacts_id: fedora42-arm64
            package_suffix: rpm
            check_container: fedora:42
            container_root: docker/fedora42
            container: dm17ryk/klogg_fedora42_arm64
            cmake_opts:
            container_platform: linux/arm64


    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-qemu-action@v3
        if: ${{ matrix.config.container_platform == 'linux/arm64' }}
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build container
        run: |
          cd ${{ matrix.config.container_root }}
          if [ "${{ matrix.config.container_platform }}" = "linux/arm64" ]; then
            docker buildx build --platform linux/arm64 -t ${{ matrix.config.container }} --load .
          else
            docker build -t ${{ matrix.config.container }} .
          fi
      - name: Configure safe Git directory
        run: git config --global --add safe.directory /usr/local

      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/docker-build
      - uses: ./.github/actions/docker-run-tests
      - uses: ./.github/actions/docker-package

# Final upload of all packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  Mac:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            os_version: 15-intel
            qt_version: 6.10.1
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: x64
            artifacts_id: macos-intel-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_CXX_FLAGS=-Wno-error=deprecated-declarations

          - os: macos
            os_version: 14    # Target macOS 14 (Sonoma)
            arch: arm64       # Apple Silicon (ARM64) architecture
            qt_version: 6.10.1
            qt_arch: clang_64
            qt_modules: qt5compat
            env:
              CXXFLAGS: "-Wno-error=deprecated-declarations"
            artifacts_id: macos-arm-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_CXX_FLAGS=-Wno-error=deprecated-declarations

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Xcode
        shell: sh
        run: |
          if [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            xcode-select -p
          fi
          xcodebuild -version

#Install build deps
      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

  Windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.10.1
            qt_modules: qt5compat
            qt_arch: win64_msvc2022_64
            qt_archives: qtbase qtimageformats qtsvg qttools qttranslations icu qtserialport
            arch: x64
            devcmd_arch: x64
            ssl_arch: -x64
            ssl_dir_arch: x64
            cmake_opts:
            artifacts_id: windows-x64-qt6

          - os: windows
            os_version: 2022
            qt_version: 6.10.1
            qt_modules: qt5compat
            qt_arch: win64_msvc2022_arm64_cross_compiled
            qt_archives: qtbase qtimageformats qtsvg qttools qttranslations qtserialport
            arch: arm64
            devcmd_arch: amd64_arm64
            ssl_arch: -arm64
            ssl_dir_arch: arm64
            cmake_opts:
            artifacts_id: windows-arm64-qt6

          # - os: windows
          #   os_version: 2022
          #   qt_version: 5.15.2
          #   qt_arch: win32_msvc2019
          #   arch: x86
          #   cmake_opts:
          #   artifacts_id: windows-x86-qt5

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v3

      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\openssl-1.1
          key: OpensslCache-1-1-1w

      - name: Download openssl
        if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }}
        run: |
          Invoke-WebRequest -Uri "https://www.firedaemon.com/download-firedaemon-openssl-1.1.1-zip" -OutFile openssl.zip
          7z x openssl.zip

      - name: Set openssl paths
        shell: sh
        run: |
          echo "SSL_DIR=${{ github.workspace }}\openssl-1.1\${{ matrix.config.ssl_dir_arch }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $GITHUB_ENV 

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.devcmd_arch }}

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-win
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}

# Final upload of all packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error

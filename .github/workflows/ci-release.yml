name: "Make CI Release"

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Run ID of CI workflow"
        required: false

permissions:
  contents: write

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success
    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}
    - name: Install validation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm
    - name: Validate Linux artifacts
      run: bash ./scripts/validate_release_linux.sh

  validate-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success
    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}
    - name: Validate Windows artifacts
      shell: pwsh
      run: ./scripts/validate_release_windows.ps1

  validate-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success
    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}
    - name: Validate macOS artifacts
      run: bash ./scripts/validate_release_macos.sh

  release:
    needs:
      - validate-linux
      - validate-windows
      - validate-macos
    runs-on: ubuntu-latest
    env:
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      KLOGG_GITHUB_TOKEN: ${{ secrets.KLOGG_GITHUB_TOKEN || github.token }}
      DISCORD_NEW_VERSIONS_WEBHOOK: ${{ secrets.DISCORD_NEW_VERSIONS_WEBHOOK }}
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success

    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}

    - name: Initialize version
      run: echo "KLOGG_VERSION=`cat klogg_version/klogg_version.txt`" >> $GITHUB_ENV

    - name: Display structure of downloaded files
      run: ls -R ./packages-*

    - name: Cleanup release artifacts
      shell: sh
      run: |
        mkdir ./linux-debug
        for debug_archive in ./packages-*/klogg_*.debug.xz; do
          if [ -f "$debug_archive" ]; then
            xz -d "$debug_archive"
          fi
        done

        for linux_binary_copy in ./packages-*/klogg_*; do
          if [ -f "$linux_binary_copy" ]; then
            case "$linux_binary_copy" in
              *.debug|*.debug.xz) ;;
              *) rm -f "$linux_binary_copy" ;;
            esac
          fi
        done

        rm -rf ./packages-macos-intel-qt6/klogg-x64.app || true
        rm -rf ./packages-macos-arm-qt6/klogg-arm64.app || true

        for debug_file in ./packages-*/klogg_*.debug; do
          if [ -f "$debug_file" ]; then
            mv "$debug_file" ./linux-debug
          fi
        done

        if ls ./linux-debug/*.debug >/dev/null 2>&1; then
          tar -cJf ./linux-debug/klogg-$KLOGG_VERSION-symbols.tar.xz ./linux-debug/*
          rm ./linux-debug/*.debug
        fi
      # rm -rf ./packages-oracle/klogg_oracle
      # mv ./packages-oracle/klogg_oracle.debug ./linux-debug

    - name: Prepare binary artifacts
      shell: sh
      run: |
        mkdir ./packages-bin

        if [ -f ./packages-appimage/klogg_deps.tar.xz ]; then
          mv ./packages-appimage/klogg_deps.tar.xz ./packages-bin/klogg-$KLOGG_VERSION-deps-x64.tar.xz
        fi
        if [ -f ./packages-appimage-arm64/klogg_deps.tar.xz ]; then
          mv ./packages-appimage-arm64/klogg_deps.tar.xz ./packages-bin/klogg-$KLOGG_VERSION-deps-arm64.tar.xz
        fi

        if [ -f ./packages-focal/klogg-$KLOGG_VERSION-focal.deb ]; then
          ar p ./packages-focal/klogg-$KLOGG_VERSION-focal.deb data.tar.gz > ./packages-bin/klogg-$KLOGG_VERSION-bin-x64.tar.gz
        fi
        if [ -f ./packages-focal-arm64/klogg-$KLOGG_VERSION-focal-arm64.deb ]; then
          ar p ./packages-focal-arm64/klogg-$KLOGG_VERSION-focal-arm64.deb data.tar.gz > ./packages-bin/klogg-$KLOGG_VERSION-bin-arm64.tar.gz
        fi

        mv ./klogg_version/klogg_version.txt ./packages-bin

    - name: Prepare checksums
      shell: sh
      run: |
        {
          find ./packages-bin -maxdepth 1 -type f
          find ./linux-debug -maxdepth 1 -type f 2>/dev/null || true
          for package_dir in ./packages-*; do
            if [ "$package_dir" != "./packages-bin" ] && [ -d "$package_dir" ]; then
              find "$package_dir" -maxdepth 1 -type f
            fi
          done
        } | sort | xargs sha256sum --binary > ./packages-bin/klogg-$KLOGG_VERSION-sha256.txt
      # sha256sum --binary ./packages-bin/* ./packages-focal/* ./packages-jammy/* ./packages-noble/* ./packages-oracle/* ./packages-appimage/*  > ./packages-bin/klogg-$KLOGG_VERSION-sha256.txt

    - name: Release continuous
      if: ${{ env.KLOGG_GITHUB_TOKEN != '' }}
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: ${{ env.KLOGG_GITHUB_TOKEN }}
        automatic_release_tag: continuous-${{ env.KLOGG_VERSION }}
        prerelease: true
        files: |
          ./packages-windows-x64-qt6/*
          ./packages-windows-arm64-vectorscan-qt6/*
          ./packages-macos-intel-qt6/*
          ./packages-macos-arm-qt6/*
          ./packages-focal/*
          ./packages-focal-arm64/*
          ./packages-jammy/*
          ./packages-jammy-arm64/*
          ./packages-noble/*
          ./packages-noble-arm64/*
          ./packages-appimage/*
          ./packages-appimage-arm64/*
          ./packages-fedora40/*
          ./packages-fedora41/*
          ./packages-fedora42/*
          ./packages-fedora40-arm64/*
          ./packages-fedora41-arm64/*
          ./packages-fedora42-arm64/*
          ./packages-bin/*
          ./linux-debug/*
        # ./packages-macos-intel-qt6/*
        # ./packages-windows-x86-qt5/*
        # ./packages-oracle/*

    - name: Discord notification
      if: ${{ env.DISCORD_NEW_VERSIONS_WEBHOOK != '' }}
      env:
        DISCORD_WEBHOOK: ${{ env.DISCORD_NEW_VERSIONS_WEBHOOK }}
        DISCORD_EMBEDS: '[{"title": "Continuous", "url": "https://github.com/dm17ryk/klogg/releases/tag/continuous-${{ env.KLOGG_VERSION }}"}]'
      uses: Ilshidur/action-discord@master
      with:
        args: 'New CI build {{KLOGG_VERSION}} has been released!'

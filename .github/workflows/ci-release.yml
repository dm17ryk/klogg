name: "Make CI Release"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "ci"
        type: choice
        options:
          - ci
          - stable
      ci-run-id:
        description: "Run ID of CI workflow"
        required: false

permissions:
  contents: write

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success
    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}
    - name: Install validation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm
    - name: Validate Linux artifacts
      run: bash ./scripts/validate_release_linux.sh

  validate-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success
    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}
    - name: Validate Windows artifacts
      shell: pwsh
      run: ./scripts/validate_release_windows.ps1

  validate-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success
    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}
    - name: Validate macOS artifacts
      run: bash ./scripts/validate_release_macos.sh

  release:
    needs:
      - validate-linux
      - validate-windows
      - validate-macos
    runs-on: ubuntu-latest
    env:
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      CILOGG_GITHUB_TOKEN: ${{ secrets.CILOGG_GITHUB_TOKEN || github.token }}
      DISCORD_NEW_VERSIONS_WEBHOOK: ${{ secrets.DISCORD_NEW_VERSIONS_WEBHOOK }}
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: ci-build.yml
        workflow_conclusion: success

    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}

    - name: Initialize version
      run: echo "CILOGG_VERSION=`cat cilogg_version/cilogg_version.txt`" >> $GITHUB_ENV

    - name: Display structure of downloaded files
      run: ls -R ./packages-*

    - name: Cleanup release artifacts
      shell: sh
      run: |
        mkdir ./linux-debug
        for debug_archive in ./packages-*/cilogg_*.debug.xz; do
          if [ -f "$debug_archive" ]; then
            xz -d "$debug_archive"
          fi
        done

        for linux_binary_copy in ./packages-*/cilogg_*; do
          if [ -f "$linux_binary_copy" ]; then
            case "$linux_binary_copy" in
              *.debug|*.debug.xz) ;;
              *) rm -f "$linux_binary_copy" ;;
            esac
          fi
        done

        rm -rf ./packages-macos-intel-qt6/cilogg-x64.app || true
        rm -rf ./packages-macos-arm-qt6/cilogg-arm64.app || true

        for debug_file in ./packages-*/cilogg_*.debug; do
          if [ -f "$debug_file" ]; then
            mv "$debug_file" ./linux-debug
          fi
        done

        if ls ./linux-debug/*.debug >/dev/null 2>&1; then
          tar -cJf ./linux-debug/cilogg-$CILOGG_VERSION-symbols.tar.xz ./linux-debug/*
          rm ./linux-debug/*.debug
        fi
      # rm -rf ./packages-oracle/cilogg_oracle
      # mv ./packages-oracle/cilogg_oracle.debug ./linux-debug

    - name: Prepare binary artifacts
      shell: sh
      run: |
        mkdir ./packages-bin

        if [ -f ./packages-appimage/cilogg_deps.tar.xz ]; then
          mv ./packages-appimage/cilogg_deps.tar.xz ./packages-bin/cilogg-$CILOGG_VERSION-deps-x64.tar.xz
        fi
        if [ -f ./packages-appimage-arm64/cilogg_deps.tar.xz ]; then
          mv ./packages-appimage-arm64/cilogg_deps.tar.xz ./packages-bin/cilogg-$CILOGG_VERSION-deps-arm64.tar.xz
        fi

        if [ -f ./packages-focal/cilogg-$CILOGG_VERSION-focal.deb ]; then
          ar p ./packages-focal/cilogg-$CILOGG_VERSION-focal.deb data.tar.gz > ./packages-bin/cilogg-$CILOGG_VERSION-bin-x64.tar.gz
        fi
        if [ -f ./packages-focal-arm64/cilogg-$CILOGG_VERSION-focal-arm64.deb ]; then
          ar p ./packages-focal-arm64/cilogg-$CILOGG_VERSION-focal-arm64.deb data.tar.gz > ./packages-bin/cilogg-$CILOGG_VERSION-bin-arm64.tar.gz
        fi

        mv ./cilogg_version/cilogg_version.txt ./packages-bin

    - name: Prepare update manifest
      shell: sh
      run: |
        python3 ./scripts/generate_update_manifest.py \
          --root . --output ./packages-bin/cilogg-update-manifest.json

    - name: Prepare checksums
      shell: sh
      run: |
        {
          find ./packages-bin -maxdepth 1 -type f ! -name '*-sha256.txt'
          find ./linux-debug -maxdepth 1 -type f 2>/dev/null || true
          for package_dir in ./packages-*; do
            if [ "$package_dir" != "./packages-bin" ] && [ -d "$package_dir" ]; then
              find "$package_dir" -maxdepth 1 -type f
            fi
          done
        } | sort | xargs sha256sum --binary > ./packages-bin/cilogg-$CILOGG_VERSION-sha256.txt
      # sha256sum --binary ./packages-bin/* ./packages-focal/* ./packages-jammy/* ./packages-noble/* ./packages-oracle/* ./packages-appimage/*  > ./packages-bin/cilogg-$CILOGG_VERSION-sha256.txt

    - name: Publish GitHub release
      if: ${{ env.CILOGG_GITHUB_TOKEN != '' }}
      env:
        GH_TOKEN: ${{ env.CILOGG_GITHUB_TOKEN }}
        RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
      shell: bash
      run: |
        if [ "$RELEASE_CHANNEL" = "stable" ]; then
          tag="v${CILOGG_VERSION}"
          flags=(--latest --generate-notes)
        else
          tag="continuous-${CILOGG_VERSION}"
          flags=(--prerelease --generate-notes)
        fi
          mapfile -d '' assets < <(
            find ./packages-* -maxdepth 1 -type f -print0
            find ./linux-debug -maxdepth 1 -type f -print0 2>/dev/null || true
          )
        gh release delete "$tag" --cleanup-tag -y || true
        gh release create "$tag" "${assets[@]}" "${flags[@]}" --title "CILogg ${CILOGG_VERSION}"
        echo "CILOGG_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

    - name: Maintain legacy latest.json
      if: ${{ env.CILOGG_GITHUB_TOKEN != '' }}
      env:
        RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        path = Path("latest.json")
        data = json.loads(path.read_text(encoding="utf-8"))
        channel = os.environ["RELEASE_CHANNEL"]
        version = os.environ["CILOGG_VERSION"]
        tag = ("v" if channel == "stable" else "continuous-") + version
        data[channel] = version
        data[channel + "_url"] = f"https://github.com/dm17ryk/klogg/releases/tag/{tag}"
        path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
        PY
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add latest.json
        git diff --cached --quiet || git commit -m "chore: update legacy release metadata [skip ci]"
        git push

    - name: Discord notification
      if: ${{ env.DISCORD_NEW_VERSIONS_WEBHOOK != '' }}
      env:
        DISCORD_WEBHOOK: ${{ env.DISCORD_NEW_VERSIONS_WEBHOOK }}
        DISCORD_EMBEDS: '[{"title": "CILogg ${{ github.event.inputs.channel }}", "url": "https://github.com/dm17ryk/klogg/releases/tag/${{ env.CILOGG_RELEASE_TAG }}"}]'
      uses: Ilshidur/action-discord@master
      with:
        args: 'New CI build {{CILOGG_VERSION}} has been released!'

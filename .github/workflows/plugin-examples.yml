name: Plugin examples and SDK
on:
  pull_request:
    paths: ['plugins/**', 'scripts/plugins/**', 'tests/plugins/**', 'test_data/message_decoders/**', '.github/workflows/plugin-examples.yml']
  push:
    branches: [master]
    paths: ['plugins/**', 'scripts/plugins/**', 'tests/plugins/**', 'test_data/message_decoders/**', '.github/workflows/plugin-examples.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/plugins -v
      - run: python scripts/plugins/package_examples.py --output plugin-packages
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cilogg-plugin-examples-${{ matrix.os }}
          path: plugin-packages/*.zip

  decoder-pdu:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Wireshark command-line tools
        run: choco install wireshark --yes --no-progress
      - name: Prove named Lua PDU dispatch and output limits
        env:
          CILOGG_TSHARK: C:\Program Files\Wireshark\tshark.exe
          CILOGG_TEXT2PCAP: C:\Program Files\Wireshark\text2pcap.exe
        run: python -m unittest discover -s tests/plugins -p 'test_message_decoder_*.py' -v
      - name: Save actual synthetic-engine proof
        run: |
          python scripts/plugins/message_decoder_pdu.py `
            --tshark "C:\Program Files\Wireshark\tshark.exe" `
            --text2pcap "C:\Program Files\Wireshark\text2pcap.exe" `
            --lua test_data/message_decoders/pdu_probe.lua `
            --manifest test_data/message_decoders/probe.json `
            --output decoder-pdu-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-pdu-proof-windows
          path: decoder-pdu-proof/result.json
          if-no-files-found: warn

name: Plugin examples and SDK
on:
  pull_request:
    paths: ['plugins/**', 'scripts/plugins/**', 'tests/plugins/**', 'test_data/message_decoders/**', '.github/workflows/plugin-examples.yml']
  push:
    branches: [master, ci/probe-177-msi-fallback]
    paths: ['plugins/**', 'scripts/plugins/**', 'tests/plugins/**', 'test_data/message_decoders/**', '.github/workflows/plugin-examples.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-pdu:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that a missing Wireshark fails the install step clearly
        shell: pwsh
        run: |
          # #177: without the tools the install step must stop the job with a clear
          # message instead of letting 36 decoder tests fail with input_missing.
          $output = pwsh -NoProfile -File scripts/plugins/install_wireshark.ps1 -VerifyOnly `
            -InstallDir (Join-Path $env:RUNNER_TEMP 'no-wireshark') 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          # Shown without "::" so this expected failure adds no error annotation.
          Write-Host "Exit code $exitCode; message: $($output.Trim() -replace '::', ': ')"
          if ($exitCode -eq 0 -or $output -notmatch 'tshark\.exe, text2pcap\.exe not found') {
            throw 'install_wireshark.ps1 did not fail clearly without the Wireshark tools'
          }
      - name: Install real Wireshark command-line tools
        shell: pwsh
        # Chocolatey with retries, then the pinned official MSI checked by SHA-256 (#177).
        run: ./scripts/plugins/install_wireshark.ps1 -ChocoAttempts 0   # probe: force the MSI fallback
      - name: Prove named Lua PDU dispatch and output limits
        env:
          CILOGG_TSHARK: C:\Program Files\Wireshark\tshark.exe
          CILOGG_TEXT2PCAP: C:\Program Files\Wireshark\text2pcap.exe
        run: python -m unittest discover -s tests/plugins -p 'test_message_decoder_*.py' -v
      - name: Save actual synthetic-engine proof
        run: |
          python scripts/plugins/message_decoder_pdu.py `
            --tshark "C:\Program Files\Wireshark\tshark.exe" `
            --text2pcap "C:\Program Files\Wireshark\text2pcap.exe" `
            --lua test_data/message_decoders/pdu_probe.lua `
            --manifest test_data/message_decoders/probe.json `
            --output decoder-pdu-proof
      - name: Save field-origin qualification
        run: |
          python scripts/plugins/message_decoder_origins.py `
            --tshark "C:\Program Files\Wireshark\tshark.exe" `
            --text2pcap "C:\Program Files\Wireshark\text2pcap.exe" `
            --lua test_data/message_decoders/pdu_probe.lua `
            --manifest test_data/message_decoders/probe.json `
            --output decoder-origin-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-pdu-proof-windows
          path: |
            decoder-pdu-proof/result.json
            decoder-origin-proof/result.json
          if-no-files-found: warn

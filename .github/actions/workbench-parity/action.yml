name: Workbench native parity
description: Verify current-build public analysis and SDK behavior in a private runtime
inputs:
  backend:
    required: true
    description: Expected configured search backend (qt or accelerated)
  native-benchmarks:
    default: 'false'
    description: Run existing native Windows GUI service and sampled-memory budgets
  sdk-smoke:
    default: 'false'
    description: Run both pinned Python MCP SDK profiles
  native-ui:
    default: 'false'
    description: Run native Windows dock and MainWindow interaction probes
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Deploy Windows application runtime
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        set -euo pipefail
        # The application uses controller plugins not imported by the test binary.
        windeployqt "$CILOGG_BUILD_ROOT/output/cilogg.exe"
    - name: Native dock interaction
      if: ${{ inputs.native-ui == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != Windows ]; then
          echo 'Native dock interaction CI currently requires a Windows desktop runner' >&2
          exit 1
        fi
        probe="$CILOGG_BUILD_ROOT/output/cilogg_itests.exe"
        windeployqt "$probe"
        python tests/mcp/workbench_usability.py \
          --executable "$CILOGG_BUILD_ROOT/output/cilogg.exe" \
          --test-executable "$probe" \
          --artifacts "$CILOGG_BUILD_ROOT/reports/workbench-ui"
        # Hosted Windows has a 1024x768 desktop. Scale only this probe process;
        # no display-mode or user configuration is changed.
        QT_SCALE_FACTOR=0.75 python tests/mcp/workbench_usability.py \
          --executable "$CILOGG_BUILD_ROOT/output/cilogg.exe" \
          --test-executable "$probe" --probe mainwindow \
          --artifacts "$CILOGG_BUILD_ROOT/reports/workbench-mainwindow"
        QT_SCALE_FACTOR=0.75 python tests/mcp/workbench_restart.py \
          --executable "$CILOGG_BUILD_ROOT/output/cilogg.exe" --platform native \
          --artifacts "$CILOGG_BUILD_ROOT/reports/workbench-restart"
    - name: Native GUI CLI MCP parity
      shell: bash
      env:
        EXPECTED_BACKEND: ${{ inputs.backend }}
        SDK_SMOKE: ${{ inputs.sdk-smoke }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = Windows ]; then
          executable="$CILOGG_BUILD_ROOT/output/cilogg.exe"
        elif [ "$RUNNER_OS" = macOS ]; then
          executable="$CILOGG_BUILD_ROOT/output/cilogg.app/Contents/MacOS/cilogg"
        else
          echo 'This host action supports Windows/macOS; Linux runs inside its build container' >&2
          exit 1
        fi
        if [ "$SDK_SMOKE" = true ]; then
          for version in 1.30.0 2.3.0; do
            sdk="$CILOGG_BUILD_ROOT/workbench-sdk-$version"
            python -m venv "$sdk"
            if [ "$RUNNER_OS" = Windows ]; then sdk_python="$sdk/Scripts/python.exe"; else sdk_python="$sdk/bin/python"; fi
            "$sdk_python" -m pip install --disable-pip-version-check "mcp==$version"
            "$sdk_python" tests/mcp/workbench_ci_gate.py --executable "$executable" \
              --cache "$CILOGG_BUILD_ROOT/CMakeCache.txt" --backend "$EXPECTED_BACKEND" \
              --sdk-version "$version" --artifacts "$CILOGG_BUILD_ROOT/reports/workbench-sdk-$version"
          done
        else
          python tests/mcp/workbench_ci_gate.py --executable "$executable" \
            --cache "$CILOGG_BUILD_ROOT/CMakeCache.txt" --backend "$EXPECTED_BACKEND" \
            --artifacts "$CILOGG_BUILD_ROOT/reports/workbench-native"
        fi
    - name: Native GUI service and sampled-memory budgets
      if: ${{ inputs.native-benchmarks == 'true' }}
      shell: bash
      env:
        EXPECTED_BACKEND: ${{ inputs.backend }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != Windows ]; then
          echo 'Native benchmark CI currently requires a Windows desktop runner' >&2
          exit 1
        fi
        executable="$CILOGG_BUILD_ROOT/output/cilogg.exe"
        probe="$CILOGG_BUILD_ROOT/output/cilogg_itests.exe"
        windeployqt "$probe"
        python tests/mcp/worker_memory.py --executable "$executable" \
          --artifacts "$CILOGG_BUILD_ROOT/reports/workbench-worker-memory"
        inputs="$CILOGG_BUILD_ROOT/reports/workbench-benchmark-inputs"
        mkdir -p "$inputs"
        export WORKBENCH_BENCHMARK_METADATA="$inputs/build.json"
        PYTHONPATH=tests/mcp python - <<'PY'
        import json
        import logging
        import os
        from pathlib import Path
        from workbench_ci_gate import git_value, verify_build
        logging.basicConfig(level=logging.INFO)
        build = Path(os.environ["CILOGG_BUILD_ROOT"])
        metadata = verify_build(build / "output/cilogg.exe", build / "CMakeCache.txt",
                                os.environ["EXPECTED_BACKEND"])
        metadata.update(sourceRevision=git_value("rev-parse", "HEAD"),
                        productSourceTree=git_value("rev-parse", "HEAD:src"),
                        testSourceTree=git_value("rev-parse", "HEAD:tests"))
        logging.info("native_benchmark_provenance revision=%s backend=%s binary_sha256=%s cache_sha256=%s",
                     metadata["sourceRevision"], metadata["configuredBackend"],
                     metadata["binarySha256"], metadata["cacheSha256"])
        Path(os.environ["WORKBENCH_BENCHMARK_METADATA"]).write_text(
            json.dumps(metadata, indent=2, allow_nan=False), encoding="utf-8")
        PY
        corpus="$CILOGG_BUILD_ROOT/workbench-benchmark-corpus"
        python scripts/benchmarks/workbench-benchmark.py \
          --generate-corpus "$corpus" --rows 100000 --seed 42
        python scripts/benchmarks/workbench-benchmark.py \
          --scenario ui-service --platform native --sample-resident-memory \
          --executable "$executable" --test-executable "$probe" \
          --corpus "$corpus" --samples 100 --repetitions 3 \
          --metadata "$WORKBENCH_BENCHMARK_METADATA" \
          --output "$CILOGG_BUILD_ROOT/reports/workbench-benchmarks"
        python scripts/benchmarks/workbench-benchmark.py \
          --scenario viewer --platform native --executable "$executable" \
          --corpus "$corpus" --repetitions 3 \
          --metadata "$WORKBENCH_BENCHMARK_METADATA" \
          --output "$CILOGG_BUILD_ROOT/reports/workbench-viewer-baseline"

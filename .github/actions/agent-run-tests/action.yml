name: "Run all tests"
description: "Run tests with ctest"
runs:
  using: "composite"
  steps:

    - name: test
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        if ! ctest --verbose; then
          echo "CTest failed; re-running failed tests once with full output"
          ctest --rerun-failed --output-on-failure --verbose
        fi

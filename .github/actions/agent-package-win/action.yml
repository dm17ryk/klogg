    - name: Win portable
      shell: cmd
      run: |
        packaging\windows\prepare_release.cmd

    - name: Win installer
      uses: joncloud/makensis-action@v3.3
      with:
        script-file: cilogg.nsi
        arguments: "-DVERSION=%CILOGG_VERSION% -DPLATFORM=%CILOGG_ARCH% -DQT_MAJOR=%CILOGG_QT%"

    - name: Win package
      shell: cmd
      run: |
        md %CILOGG_BUILD_ROOT%\packages
        xcopy cilogg-%CILOGG_VERSION%-%CILOGG_ARCH%-%CILOGG_QT%-portable.zip %CILOGG_BUILD_ROOT%\packages /y
        xcopy cilogg-%CILOGG_VERSION%-%CILOGG_ARCH%-%CILOGG_QT%-pdb.zip %CILOGG_BUILD_ROOT%\packages /y
        xcopy cilogg-%CILOGG_VERSION%-%CILOGG_ARCH%-%CILOGG_QT%-setup.exe %CILOGG_BUILD_ROOT%\packages /y


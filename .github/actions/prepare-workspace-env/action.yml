name: "Set common env vars"
description: ""
runs:
  using: "composite"
  steps:
    - name: Set common env vars
      shell: sh
      run: |
        echo "KLOGG_WORKSPACE=${{ github.workspace }}" >> $GITHUB_ENV
        echo "KLOGG_BUILD_ROOT=build_root" >> $GITHUB_ENV
        echo "KLOGG_ARCH=${{ matrix.config.arch }}" >> $GITHUB_ENV
        echo "KLOGG_CMAKE_OPTS=-G Ninja -DCMAKE_BUILD_TYPE=Release -DKLOGG_GENERIC_CPU=OFF -DKLOGG_USE_SENTRY=ON -DCMAKE_INSTALL_PREFIX=/usr ${{ matrix.config.cmake_opts }}" >> $GITHUB_ENV
        if [ -n "${{ matrix.config.container_platform }}" ]; then
          echo "KLOGG_DOCKER_PLATFORM=--platform ${{ matrix.config.container_platform }}" >> $GITHUB_ENV
        else
          echo "KLOGG_DOCKER_PLATFORM=" >> $GITHUB_ENV
        fi
    - name: Set macOS SDK root
      if: runner.os == 'macOS'
      shell: sh
      run: |
        SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
        echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
        echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DCMAKE_OSX_SYSROOT=$SDKROOT" >> $GITHUB_ENV

    - name: Set qt env var
      if: "startsWith(matrix.config.qt_version, '5')"
      shell: sh
      run: |
        QT_DIR="${{ env.Qt5_Dir }}"
        if [ -z "$QT_DIR" ]; then
          QT_DIR="${{ env.Qt5_DIR }}"
        fi
        echo "KLOGG_QT=Qt5" >> $GITHUB_ENV
        echo "KLOGG_QT_DIR=$QT_DIR" >> $GITHUB_ENV

    - name: Set qt env var
      if: "startsWith(matrix.config.qt_version, '6')"
      shell: sh
      run: |
        QT_DIR="${{ env.Qt6_Dir }}"
        if [ -z "$QT_DIR" ]; then
          QT_DIR="${{ env.Qt6_DIR }}"
        fi
        echo "KLOGG_QT=Qt6" >> $GITHUB_ENV
        echo "KLOGG_QT_DIR=$QT_DIR" >> $GITHUB_ENV

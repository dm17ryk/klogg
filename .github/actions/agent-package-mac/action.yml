name: "Prepare CILogg mac packages"
description: ""
inputs:
  p12-file-base64:
    required: false
  p12-password:
    required: false
  notarization-username:
    required: false
  notarization-team:
    required: false
  notarization-password:
    required: false
    
runs:
  using: "composite"
  steps:
    - name: Mac prepare codesign
      id: prepare-codesign
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' && inputs.p12-password != '' }}
      uses: apple-actions/import-codesign-certs@v1
      with: 
        p12-file-base64: ${{ inputs.p12-file-base64 }}
        p12-password: ${{ inputs.p12-password }}
     
    - name: Mac deploy Qt
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        macdeployqt ./output/cilogg.app -always-overwrite -verbose=2

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '5')"
      shell: sh
      run: |
        QT_PATH="${Qt5_DIR:-$Qt5_Dir}"
        python3 $CILOGG_BUILD_ROOT/macdeployqtfix.py $CILOGG_BUILD_ROOT/output/cilogg.app/Contents/MacOS/cilogg "$QT_PATH"

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '6')"
      shell: sh
      run: |
        QT_PATH="${Qt6_DIR:-$Qt6_Dir}"
        python3 $CILOGG_BUILD_ROOT/macdeployqtfix.py $CILOGG_BUILD_ROOT/output/cilogg.app/Contents/MacOS/cilogg "$QT_PATH" || echo "Skipping non-fatal Qt6 deploy fix failure"
    
    - name: Mac deploy Qt SerialPort
      shell: sh
      run: |
        APP_FRAMEWORKS="$CILOGG_BUILD_ROOT/output/cilogg.app/Contents/Frameworks"
        QT_DIR="${Qt6_DIR:-${Qt6_Dir:-${Qt5_DIR:-$Qt5_Dir}}}"
        if [ -n "$QT_DIR" ] && [ -d "$QT_DIR/lib/QtSerialPort.framework" ]; then
          if [ ! -d "$APP_FRAMEWORKS/QtSerialPort.framework" ]; then
            cp -R "$QT_DIR/lib/QtSerialPort.framework" "$APP_FRAMEWORKS/"
          fi
        fi
    
    - name: Set packaging env
      shell: sh
      run: |
        echo "CILOGG_CODESIGN=Developer ID Application: Anton Filimonov (GAW773U324)" >> $GITHUB_ENV
        echo "CILOGG_INSTALLERSIGN=Developer ID Installer: Anton Filimonov (GAW773U324)" >> $GITHUB_ENV
        echo "CILOGG_DMG=cilogg-${{ env.CILOGG_VERSION }}-mac-${{ env.CILOGG_ARCH }}.dmg" >> $GITHUB_ENV
        echo "CILOGG_PKG=cilogg-${{ env.CILOGG_VERSION }}-mac-${{ env.CILOGG_ARCH }}.pkg" >> $GITHUB_ENV

    - name: Mac codesign binaries
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' && inputs.p12-password != '' }}
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        codesign -v -f -o runtime --deep --timestamp -s "${{ env.CILOGG_CODESIGN }}" ./output/cilogg.app;
    
    - name: Mac pack dmg
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        if ! cpack --verbose -G "DragNDrop"; then
          echo "CPack DMG generation failed, falling back to hdiutil"
          for attempt in 1 2 3 4 5; do
            if [ ! -e "/Volumes/CILogg" ]; then
              break
            fi
            echo "Unmounting stale CILogg volume before fallback attempt ${attempt}"
            hdiutil detach "/Volumes/CILogg" -force || diskutil unmount force "/Volumes/CILogg" || true
            sleep 2
          done
          mkdir -p ./packages
          rm -f "./packages/cilogg-${CILOGG_VERSION}-OSX.dmg"
          hdiutil create -fs HFS+ -srcfolder ./output/cilogg.app -volname "CILogg" -format UDZO "./packages/cilogg-${CILOGG_VERSION}-OSX.dmg"
        fi

    - name: Mac rename dmg
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        if [ -f "./packages/cilogg-${CILOGG_VERSION}-OSX.dmg" ]; then
          mv "./packages/cilogg-${CILOGG_VERSION}-OSX.dmg" "./packages/${CILOGG_DMG}"
        fi

    - name: Mac codesign dmg
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' && inputs.p12-password != '' }}
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        codesign -v -f -o runtime --timestamp -s "${{ env.CILOGG_CODESIGN }}" ./packages/${{ env.CILOGG_DMG }}
    
    - name: Mac notarize DMG 
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' && inputs.p12-password != '' && inputs.notarization-username != '' && inputs.notarization-team != '' && inputs.notarization-password != '' }} 
      shell: sh
      run: |
        xcrun notarytool submit --wait --apple-id "${{ inputs.notarization-username }}" --team-id "${{ inputs.notarization-team }}" --password "${{ inputs.notarization-password }}" "${{ env.CILOGG_BUILD_ROOT }}/packages/${{ env.CILOGG_DMG }}" | tee dmg_notary.log
        dmg_notary_id=$(awk '$1=="id:"{id=$2} END{print id}' dmg_notary.log)
        xcrun notarytool log --apple-id "${{ inputs.notarization-username }}" --team-id "${{ inputs.notarization-team }}" --password "${{ inputs.notarization-password }}" "$dmg_notary_id" "dmg_notary.log.json"
        cat "dmg_notary.log.json"

    - name: Mac staple DMG 
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' && inputs.p12-password != '' && inputs.notarization-username != '' && inputs.notarization-team != '' && inputs.notarization-password != '' }} 
      shell: sh
      run: |
        xcrun stapler staple "${{ env.CILOGG_BUILD_ROOT }}/packages/${{ env.CILOGG_DMG }}"

    #- name: "Mac build pkg"
    #  if: ${{ github.event_name != 'pull_request' }}
    #  shell: sh
    #  run: |
    #    cd $CILOGG_BUILD_ROOT
    #    mkdir -p packages
    #    mkdir -p pkg_resources/en.lproj
    #    cp ../COPYING pkg_resources/en.lproj
    #    cp ../packaging/description.txt pkg_resources/en.lproj
    #    sed -e s/%cilogg_version%/${{ env.CILOGG_VERSION }}/ -e s/%cilogg_pkg%/cilogg-${{ env.CILOGG_VERSION }}-OSX.pkg/ ../packaging/osx/distribution.xml > distribution.xml
    #    pkgbuild --component ./output/cilogg.app --install-location /Applications --version ${{ env.CILOGG_VERSION }} --sign "${{ env.CILOGG_INSTALLERSIGN }}" --timestamp ./output/cilogg-${{ env.CILOGG_VERSION }}-OSX.pkg
    #    productbuild --package-path ./output --distribution distribution.xml --resources ./pkg_resources --sign "${{ env.CILOGG_INSTALLERSIGN }}" --timestamp ./output/cilogg-${{ env.CILOGG_VERSION }}-OSX-product.pkg
    #    pkgutil --expand ./output/cilogg-${{ env.CILOGG_VERSION }}-OSX-product.pkg ./output/cilogg_product_pkg
    #    pkgutil --flatten ./output/cilogg_product_pkg ./output/cilogg-${{ env.CILOGG_VERSION }}-OSX-flatten.pkg
    #    productsign --sign "${{ env.CILOGG_INSTALLERSIGN }}" --timestamp ./output/cilogg-${{ env.CILOGG_VERSION }}-OSX-flatten.pkg ./packages/${{ env.CILOGG_PKG }}

    #- name: Mac notarize PKG 
    #  if: ${{ github.event_name != 'pull_request' }} 
    #  shell: sh
    #  run: |
    #    xcrun notarytool submit  --wait --apple-id "${{ inputs.notarization-username }}" --team-id "${{ inputs.notarization-team }}" --password "${{ inputs.notarization-password }}" "${{ env.CILOGG_BUILD_ROOT }}/packages/${{ env.CILOGG_PKG }}" | tee pkg_notary.log
    #    pkg_notary_id=$(awk '$1=="id:"{id=$2} END{print id}' pkg_notary.log)
    #    xcrun notarytool log --apple-id "${{ inputs.notarization-username }}" --team-id "${{ inputs.notarization-team }}" --password "${{ inputs.notarization-password }}" "$pkg_notary_id" "pkg_notary.log.json"
    #    cat "pkg_notary.log.json"

    #- name: Mac staple PKG 
    #  if: ${{ github.event_name != 'pull_request' }} 
    #  shell: sh 
    #  run: |
    #    xcrun stapler staple "${{ env.CILOGG_BUILD_ROOT }}/packages/${{ env.CILOGG_PKG }}"

    - name: Mac symbols
      shell: sh
      run: |
        cd $CILOGG_BUILD_ROOT
        cp -a ./output/cilogg.dSym ./packages/cilogg-${{ env.CILOGG_ARCH }}.dSym
        cp -a ./output/cilogg.app ./packages/cilogg-${{ env.CILOGG_ARCH }}.app

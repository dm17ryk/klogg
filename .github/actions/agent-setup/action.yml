name: "Setup agent"
description: ""
runs:
  using: "composite"
  steps:
    - name: Check runner Ninja
      shell: sh
      run: ninja --version

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ../Qt
        key: ${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.qt_version }}-QtCache

    - name: Install Qt host prerequisites
      if: ${{ matrix.config.qt_host_arch && matrix.config.qt_arch != 'win64_msvc2022_arm64_cross_compiled' }}
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.config.qt_version }}
        arch: ${{ matrix.config.qt_host_arch }}
        cache: ${{ steps.cache-qt.outputs.cache-hit }}
        set-env: false

    - name: Install Qt 6.12 (windows x64)
      if: ${{ runner.os == 'Windows' && matrix.config.qt_version == '6.12.0' && matrix.config.qt_arch == 'win64_msvc2022_64' && steps.cache-qt.outputs.cache-hit != 'true' }}
      shell: pwsh
      run: |
        python -m pip install "aqtinstall==3.3.0"
        if ($LASTEXITCODE -ne 0) { throw "aqtinstall installation failed: $LASTEXITCODE" }
        python tests/scripts/test_aqt_windows_612.py
        if ($LASTEXITCODE -ne 0) { throw "Qt metadata adapter tests failed: $LASTEXITCODE" }
        python scripts/codex/aqt-windows-612.py install-qt windows desktop ${{ matrix.config.qt_version }} ${{ matrix.config.qt_arch }} --outputdir "$env:GITHUB_WORKSPACE\..\Qt" --modules ${{ matrix.config.qt_modules }} qtserialport qtimageformats --archives ${{ matrix.config.qt_archives }}
        if ($LASTEXITCODE -ne 0) { throw "Qt x64 installation failed: $LASTEXITCODE" }

    - name: Install Qt (windows arm64 manual)
      if: ${{ runner.os == 'Windows' && matrix.config.qt_arch == 'win64_msvc2022_arm64_cross_compiled' && steps.cache-qt.outputs.cache-hit != 'true' }}
      shell: pwsh
      run: |
        python -m pip install "aqtinstall==3.3.0"
        if ($LASTEXITCODE -ne 0) { throw "aqtinstall installation failed: $LASTEXITCODE" }
        python tests/scripts/test_aqt_windows_612.py
        if ($LASTEXITCODE -ne 0) { throw "Qt metadata adapter tests failed: $LASTEXITCODE" }
        python scripts/codex/aqt-windows-612.py install-qt windows desktop ${{ matrix.config.qt_version }} ${{ matrix.config.qt_host_arch }} --outputdir "$env:GITHUB_WORKSPACE\..\Qt" --modules ${{ matrix.config.qt_modules }} qtserialport qtimageformats --archives qtbase qtsvg qttools qttranslations
        if ($LASTEXITCODE -ne 0) { throw "Qt host installation failed: $LASTEXITCODE" }
        $armBin = "$env:GITHUB_WORKSPACE\..\Qt\${{ matrix.config.qt_version }}\msvc2022_arm64\bin"
        New-Item -ItemType Directory -Path $armBin -Force | Out-Null
        foreach ( $tool in @("qmake", "qmake6", "qtpaths", "qtpaths6") ) {
          "@echo off`r`n" | Out-File -FilePath "$armBin\$tool.bat" -Encoding ascii -Force
        }
        python scripts/codex/aqt-windows-612.py install-qt windows desktop ${{ matrix.config.qt_version }} win64_msvc2022_arm64_cross_compiled --autodesktop --outputdir "$env:GITHUB_WORKSPACE\..\Qt" --modules ${{ matrix.config.qt_modules }} qtserialport qtimageformats --archives qtbase qtsvg qttools qttranslations
        if ($LASTEXITCODE -ne 0) { throw "Qt ARM64 installation failed: $LASTEXITCODE" }

    - name: Set Qt6_Dir for windows arm64
      if: ${{ runner.os == 'Windows' && matrix.config.qt_arch == 'win64_msvc2022_arm64_cross_compiled' }}
      shell: pwsh
      run: |
        $qtRoot = "$env:GITHUB_WORKSPACE\..\Qt\${{ matrix.config.qt_version }}\msvc2022_arm64"
        $qtHostRoot = "$env:GITHUB_WORKSPACE\..\Qt\${{ matrix.config.qt_version }}\msvc2022_64"
        "Qt6_Dir=$qtRoot" >> $env:GITHUB_ENV
        "Qt6_DIR=$qtRoot" >> $env:GITHUB_ENV
        "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
        "QT_HOST_PATH=$qtHostRoot" >> $env:GITHUB_ENV
        "QT_FORCE_FIND_TOOLS=ON" >> $env:GITHUB_ENV
        "QT_TOOLCHAIN_FILE=$qtRoot\lib\cmake\Qt6\qt.toolchain.cmake" >> $env:GITHUB_ENV
        "$qtHostRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Set Qt6_Dir fallback for windows x64
      if: ${{ runner.os == 'Windows' && matrix.config.qt_arch == 'win64_msvc2022_64' }}
      shell: pwsh
      run: |
        $qtRoot = "$env:GITHUB_WORKSPACE\..\Qt\${{ matrix.config.qt_version }}\msvc2022_64"
        if (Test-Path $qtRoot) {
          "Qt6_Dir=$qtRoot" >> $env:GITHUB_ENV
          "Qt6_DIR=$qtRoot" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Install Qt (with archives)
      if: ${{ matrix.config.qt_arch && matrix.config.qt_archives && matrix.config.qt_arch != 'win64_msvc2022_arm64_cross_compiled' && !(runner.os == 'Windows' && matrix.config.qt_version == '6.12.0') }}
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.config.qt_version }}
        arch: ${{ matrix.config.qt_arch }}
        cache: ${{ steps.cache-qt.outputs.cache-hit }}
        modules: ${{ matrix.config.qt_modules }} qtserialport
        archives: ${{ matrix.config.qt_archives }}

    - name: Install Qt (default archives)
      if: ${{ matrix.config.qt_arch && !matrix.config.qt_archives && matrix.config.qt_arch != 'win64_msvc2022_arm64_cross_compiled' && !(runner.os == 'Windows' && matrix.config.qt_version == '6.12.0') }}
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.config.qt_version }}
        arch: ${{ matrix.config.qt_arch }}
        cache: ${{ steps.cache-qt.outputs.cache-hit }}
        modules: ${{ matrix.config.qt_modules }} qtserialport

    - name: Verify Windows Qt 6.12 kits
      if: ${{ runner.os == 'Windows' && matrix.config.qt_version == '6.12.0' }}
      shell: pwsh
      run: |
        $hostRoot = "$env:GITHUB_WORKSPACE\..\Qt\${{ matrix.config.qt_version }}\msvc2022_64"
        $version = & "$hostRoot\bin\qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "${{ matrix.config.qt_version }}") {
          throw "Unexpected host Qt version: $version (exit $LASTEXITCODE)"
        }
        $targetArch = if ("${{ matrix.config.arch }}" -eq "arm64") { "msvc2022_arm64" } else { "msvc2022_64" }
        $targetRoot = "$env:GITHUB_WORKSPACE\..\Qt\${{ matrix.config.qt_version }}\$targetArch"
        foreach ($library in @("Qt6Core.dll", "Qt6Core5Compat.dll", "Qt6SerialPort.dll", "Qt6Svg.dll")) {
          $path = Join-Path $targetRoot "bin\$library"
          if (-not (Test-Path -LiteralPath $path)) { throw "Required Qt library missing: $path" }
        }
        Write-Host "Verified Qt $version host=$hostRoot target=$targetRoot"

    - name: Set boost env vars
      shell: sh
      run: |
        echo "BOOST_ROOT=${{github.workspace}}/3rdparty/boost" >> $GITHUB_ENV
        echo "BOOST_URL=https://sourceforge.net/projects/boost/files/boost/1.86.0/boost_1_86_0.tar.bz2/download" >> $GITHUB_ENV

    - name: Restore Boost cache
      uses: actions/cache@v4
      id: cache-boost
      with:
        path: ${{env.BOOST_ROOT}}
        key: ${{env.BOOST_URL}}

    - name: Install Boost
      shell: bash
      run: |
        if echo ${{ steps.cache-boost.outputs.cache-hit }} | grep -c "true"
        then
          echo "Using boost from cache"
        else
          echo "Downloading boost"
          if [ "$OS" == "Windows_NT" ]; then
            # fix up paths to be forward slashes consistently
            BOOST_ROOT=$(echo $BOOST_ROOT | sed 's/\\/\//g')
          fi
          mkdir -p $BOOST_ROOT
          curl --progress-bar --location --output $BOOST_ROOT/download.tar.bz2 $BOOST_URL
          7z -o$BOOST_ROOT x $BOOST_ROOT/download.tar.bz2 -y -bd
          7z -o$BOOST_ROOT x $BOOST_ROOT/download.tar -y -bd
          cd $BOOST_ROOT && cp -r boost_*/* .
          rm -rf boost_*/* download.tar.bz2 download.tar
        fi




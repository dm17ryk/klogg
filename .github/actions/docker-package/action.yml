name: "Create a package"
description: "Creates a package from build output"
runs:
  using: "composite"
  steps:
    - name: package
      if: ${{ matrix.config.cpack_gen }}
      shell: sh
      run: |
        docker run $KLOGG_DOCKER_PLATFORM -v "$KLOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && cpack -G ${{ matrix.config.cpack_gen }} "
        docker run $KLOGG_DOCKER_PLATFORM --env KLOGG_VERSION=$KLOGG_VERSION -v "$KLOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && mv ./packages/klogg-$KLOGG_VERSION-Linux.${{ matrix.config.package_suffix }} ./packages/klogg-$KLOGG_VERSION-${{ matrix.config.artifacts_id }}.${{ matrix.config.package_suffix }}"

    - name: Check package
      if: ${{ matrix.config.check_command }}
      shell: sh
      run: |
        docker run $KLOGG_DOCKER_PLATFORM --rm -v "$KLOGG_WORKSPACE/$KLOGG_BUILD_ROOT/packages":/usr/local ${{ matrix.config.check_container }} /bin/bash -c "${{ matrix.config.check_command }}"

    - name: Linux AppImage
      if: ${{ contains(matrix.config.artifacts_id, 'appimage') }}
      shell: sh
      run: |
        docker run $KLOGG_DOCKER_PLATFORM --device /dev/fuse --privileged --env KLOGG_VERSION=$KLOGG_VERSION -v "$KLOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && ../packaging/linux/appimage/generate_appimage.sh"

    - name: Copy sym
      shell: sh
      run: |
        docker run $KLOGG_DOCKER_PLATFORM -v "$KLOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && if [ -f ./output/klogg.debug ]; then xz ./output/klogg.debug && mv ./output/klogg.debug.xz ./packages/klogg_${{ matrix.config.artifacts_id }}.debug.xz; else echo 'klogg.debug is not present, skipping symbol archive'; fi"
        docker run $KLOGG_DOCKER_PLATFORM -v "$KLOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && cp ./output/klogg ./packages/klogg_${{ matrix.config.artifacts_id }}"

    - name: Copy deps
      if: ${{ contains(matrix.config.artifacts_id, 'appimage') }}
      shell: sh
      run: |
        docker run $KLOGG_DOCKER_PLATFORM -v "$KLOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local && tar -cJf ./build_root/packages/klogg_deps.tar.xz ./cpm_cache"

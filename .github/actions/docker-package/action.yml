name: "Create a package"
description: "Creates a package from build output"
runs:
  using: "composite"
  steps:
    - name: package
      if: ${{ matrix.config.cpack_gen }}
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && cpack -G ${{ matrix.config.cpack_gen }} "
        docker run $CILOGG_DOCKER_PLATFORM --env CILOGG_VERSION=$CILOGG_VERSION -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && mv ./packages/cilogg-$CILOGG_VERSION-Linux.${{ matrix.config.package_suffix }} ./packages/cilogg-$CILOGG_VERSION-${{ matrix.config.artifacts_id }}.${{ matrix.config.package_suffix }}"

    - name: Check private RPM dependencies
      if: ${{ matrix.config.cpack_gen == 'RPM' && matrix.config.qt_version == '6.12.0' }}
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM --rm -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local && bash scripts/validate_private_rpm.sh build_root/packages/*.rpm"

    - name: Check package
      if: ${{ matrix.config.check_command }}
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM --rm --env QT_DEBUG_PLUGINS=1 -v "$CILOGG_WORKSPACE/$CILOGG_BUILD_ROOT/packages":/usr/local ${{ matrix.config.check_container }} /bin/bash -c "${{ matrix.config.check_command }}"

    - name: Preserve failed native packages and deployment scripts
      if: ${{ failure() && matrix.config.cpack_gen && matrix.config.qt_version == '6.12.0' }}
      uses: actions/upload-artifact@v4
      with:
        name: failed-native-${{ matrix.config.artifacts_id }}
        include-hidden-files: true
        path: |
          ${{ env.CILOGG_BUILD_ROOT }}/packages/*
          ${{ env.CILOGG_BUILD_ROOT }}/.qt/deploy_*.cmake
          ${{ env.CILOGG_BUILD_ROOT }}/InstallPrivateQtConfig.cmake
          ${{ env.CILOGG_BUILD_ROOT }}/_CPack_Packages/**/qt.conf
        if-no-files-found: warn

    - name: Linux AppImage
      if: ${{ contains(matrix.config.artifacts_id, 'appimage') }}
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM --env CILOGG_VERSION=$CILOGG_VERSION -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && bash ../packaging/linux/appimage/generate_appimage.sh"

    - name: Validate Linux AppImage
      if: ${{ contains(matrix.config.artifacts_id, 'appimage') }}
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c 'set -euo pipefail; cd /usr/local/build_root; images=(./packages/*.AppImage); test "${#images[@]}" -eq 1; bash ../packaging/linux/appimage/validate_appimage.sh "${images[0]}"'

    - name: Copy sym
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && if [ -f ./output/cilogg.debug ]; then xz ./output/cilogg.debug && mv ./output/cilogg.debug.xz ./packages/cilogg_${{ matrix.config.artifacts_id }}.debug.xz; else echo 'cilogg.debug is not present, skipping symbol archive'; fi"
        docker run $CILOGG_DOCKER_PLATFORM -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local/build_root && cp ./output/cilogg ./packages/cilogg_${{ matrix.config.artifacts_id }}"

    - name: Copy deps
      if: ${{ contains(matrix.config.artifacts_id, 'appimage') }}
      shell: sh
      run: |
        docker run $CILOGG_DOCKER_PLATFORM -v "$CILOGG_WORKSPACE":/usr/local ${{ matrix.config.container }} /bin/bash -c "cd /usr/local && tar -cJf ./build_root/packages/cilogg_deps.tar.xz ./cpm_cache"
